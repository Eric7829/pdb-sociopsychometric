<svg xmlns='http://www.w3.org/2000/svg' width='760' height='390' viewBox='0 0 760 390' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' role='img' aria-label='Crowd vs model near-miss structure'><defs><pattern id='hatch' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='6' height='6' fill='#fcfcfb'/><line x1='0' y1='0' x2='0' y2='6' stroke='#eb6834' stroke-width='2.5'/></pattern></defs><rect width='760' height='390' rx='12' fill='#fcfcfb'/><text x='24' y='34' font-size='18' fill='#0b0b0b' text-anchor='start' font-weight='650'>PDB voters think in cognitive functions. Text models think in letters.</text><text x='24' y='56' font-size='13' fill='#52514e' text-anchor='start' font-weight='400'>Share of near-miss types differing by one letter</text><rect x='450' y='66' width='12' height='12' rx='3' fill='#2a78d6'/><text x='468' y='77' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>Crowd's runner-up vote</text><rect x='610' y='66' width='12' height='12' rx='3' fill='#eb6834'/><text x='628' y='77' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>Model errors</text><line x1='70' y1='330.0' x2='730' y2='330.0' stroke='#e6e5e0'/><text x='62' y='334.0' font-size='11' fill='#8a8984' text-anchor='end' font-weight='400'>0%</text><line x1='70' y1='271.5' x2='730' y2='271.5' stroke='#e6e5e0'/><text x='62' y='275.5' font-size='11' fill='#8a8984' text-anchor='end' font-weight='400'>10%</text><line x1='70' y1='213.0' x2='730' y2='213.0' stroke='#e6e5e0'/><text x='62' y='217.0' font-size='11' fill='#8a8984' text-anchor='end' font-weight='400'>20%</text><line x1='70' y1='154.5' x2='730' y2='154.5' stroke='#e6e5e0'/><text x='62' y='158.5' font-size='11' fill='#8a8984' text-anchor='end' font-weight='400'>30%</text><line x1='70' y1='96.0' x2='730' y2='96.0' stroke='#e6e5e0'/><text x='62' y='100.0' font-size='11' fill='#8a8984' text-anchor='end' font-weight='400'>40%</text><path d='M112.25,330 v-171.5 a4,4 0 0 1 4,-4 h30 a4,4 0 0 1 4,4 v171.5 z' fill='#2a78d6'/><text x='131.25' y='148.5' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='650'>30%</text><path d='M152.25,330 v-165.7 a4,4 0 0 1 4,-4 h30 a4,4 0 0 1 4,4 v165.7 z' fill='#eb6834'/><text x='171.25' y='154.35' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='650'>29%</text><text x='151.25' y='350' font-size='13' fill='#0b0b0b' text-anchor='middle' font-weight='400'>E/I flip</text><path d='M274.75,330 v-148.1 a4,4 0 0 1 4,-4 h30 a4,4 0 0 1 4,4 v148.1 z' fill='#2a78d6'/><text x='293.75' y='171.9' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='650'>26%</text><path d='M314.75,330 v-89.6 a4,4 0 0 1 4,-4 h30 a4,4 0 0 1 4,4 v89.6 z' fill='#eb6834'/><text x='333.75' y='230.4' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='650'>16%</text><text x='313.75' y='350' font-size='13' fill='#0b0b0b' text-anchor='middle' font-weight='400'>S/N flip</text><path d='M437.25,330 v-130.6 a4,4 0 0 1 4,-4 h30 a4,4 0 0 1 4,4 v130.6 z' fill='#2a78d6'/><text x='456.25' y='189.45' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='650'>23%</text><path d='M477.25,330 v-118.8 a4,4 0 0 1 4,-4 h30 a4,4 0 0 1 4,4 v118.8 z' fill='#eb6834'/><text x='496.25' y='201.15' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='650'>21%</text><text x='476.25' y='350' font-size='13' fill='#0b0b0b' text-anchor='middle' font-weight='400'>T/F flip</text><path d='M599.75,330 v-113.0 a4,4 0 0 1 4,-4 h30 a4,4 0 0 1 4,4 v113.0 z' fill='#2a78d6'/><text x='618.75' y='207.0' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='650'>20%</text><path d='M639.75,330 v-194.9 a4,4 0 0 1 4,-4 h30 a4,4 0 0 1 4,4 v194.9 z' fill='#eb6834'/><text x='658.75' y='125.1' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='650'>34%</text><text x='638.75' y='350' font-size='13' fill='#0b0b0b' text-anchor='middle' font-weight='400'>J/P flip</text><text x='24' y='376' font-size='11' fill='#8a8984' text-anchor='start' font-weight='400'>In function theory E/I flips keep both functions (INTP↔ENTP) and J/P flips keep none (INTP↔INTJ).</text></svg>