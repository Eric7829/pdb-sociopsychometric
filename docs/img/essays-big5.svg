<svg xmlns='http://www.w3.org/2000/svg' width='760' height='328' viewBox='0 0 760 328' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' role='img' aria-label='Big Five on 2,467 student essays'><defs><pattern id='hatch' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='6' height='6' fill='#fcfcfb'/><line x1='0' y1='0' x2='0' y2='6' stroke='#eb6834' stroke-width='2.5'/></pattern></defs><rect width='760' height='328' rx='12' fill='#fcfcfb'/><text x='24' y='34' font-size='18' fill='#0b0b0b' text-anchor='start' font-weight='650'>Big Five on 2,467 student essays</text><text x='24' y='56' font-size='13' fill='#52514e' text-anchor='start' font-weight='400'>Median-split accuracy vs the writers’ own questionnaire scores</text><line x1='250.0' y1='70' x2='250.0' y2='292' stroke='#e6e5e0'/><text x='250.0' y='310' font-size='11' fill='#8a8984' text-anchor='middle' font-weight='400'>0%</text><line x1='370.0' y1='70' x2='370.0' y2='292' stroke='#e6e5e0'/><text x='370.0' y='310' font-size='11' fill='#8a8984' text-anchor='middle' font-weight='400'>20%</text><line x1='490.0' y1='70' x2='490.0' y2='292' stroke='#e6e5e0'/><text x='490.0' y='310' font-size='11' fill='#8a8984' text-anchor='middle' font-weight='400'>40%</text><line x1='610.0' y1='70' x2='610.0' y2='292' stroke='#e6e5e0'/><text x='610.0' y='310' font-size='11' fill='#8a8984' text-anchor='middle' font-weight='400'>60%</text><text x='238' y='96.0' font-size='13' fill='#0b0b0b' text-anchor='end' font-weight='400'>Majority baseline</text><path d='M250,78 h304.4 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-304.4 z' fill='#b9b8b2'/><text x='566.4' y='96.0' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='650'>51.4%</text><text x='238' y='138.0' font-size='13' fill='#0b0b0b' text-anchor='end' font-weight='400'>Mairesse et al. 2007</text><path d='M250,120 h336.2 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-336.2 z' fill='#b9b8b2'/><text x='598.2' y='138.0' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='650'>56.7%</text><text x='238' y='153.0' font-size='10.5' fill='#8a8984' text-anchor='end' font-weight='400'>trained on these essays</text><text x='238' y='180.0' font-size='13' fill='#0b0b0b' text-anchor='end' font-weight='400'>Our model</text><path d='M250,162 h333.8 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-333.8 z' fill='#2a78d6'/><text x='595.8' y='180.0' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='650'>56.3%</text><text x='238' y='195.0' font-size='10.5' fill='#8a8984' text-anchor='end' font-weight='400'>never saw a single essay</text><text x='238' y='222.0' font-size='13' fill='#0b0b0b' text-anchor='end' font-weight='400'>Majumder et al. 2017</text><path d='M250,204 h348.8 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-348.8 z' fill='#b9b8b2'/><text x='610.8' y='222.0' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='650'>58.8%</text><text x='238' y='237.0' font-size='10.5' fill='#8a8984' text-anchor='end' font-weight='400'>trained on these essays, best per trait</text><text x='238' y='264.0' font-size='13' fill='#0b0b0b' text-anchor='end' font-weight='400'>Our DeepSeek agent</text><path d='M250,246 h354.8 a4,4 0 0 1 4,4 v18 a4,4 0 0 1 -4,4 h-354.8 z' fill='#2a78d6'/><text x='616.8' y='264.0' font-size='13' fill='#0b0b0b' text-anchor='start' font-weight='650'>59.8%</text><text x='238' y='279.0' font-size='10.5' fill='#8a8984' text-anchor='end' font-weight='400'>zero-shot, 100 essays</text></svg>